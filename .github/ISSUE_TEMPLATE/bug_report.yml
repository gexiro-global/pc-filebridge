name: Bug report
description: Report a reproducible PC FileBridge defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private filenames, absolute host paths, tunnel identifiers, configuration contents, or document contents. Report security vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps using temporary paths and synthetic content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and structured error code
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed secrets, private paths, tunnel identifiers, and real file content.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
